<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Glowing subtle inner circle -->
  <circle cx="256" cy="256" r="180" fill="#00f2fe" fill-opacity="0.03" />

  <!-- Code Bracket Left < -->
  <path d="M 125 185 L 65 256 L 125 327" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Code Bracket Right > -->
  <path d="M 387 185 L 447 256 L 387 327" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Monogram S -->
  <path d="M 225 195 C 215 175, 175 170, 160 195 C 145 220, 160 245, 205 258 C 248 270, 252 300, 240 325 C 225 350, 175 350, 155 330" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Monogram M -->
  <path d="M 275 335 L 275 185 L 318 260 L 360 185 L 360 335" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="30" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Tech accent glowing dot -->
  <circle cx="256" cy="395" r="9" fill="#00f2fe" filter="url(#glow)"/>
</svg>