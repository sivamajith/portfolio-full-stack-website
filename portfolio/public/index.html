<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.png" />
    <link rel="alternate icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Siva majith - Full-Stack Developer Portfolio"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Siva majith | Full-Stack Developer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <style>
        #initial-preloader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0b1220;
          color: #f8fafc;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;
          z-index: 999999;
          user-select: none;
          overflow: hidden;
        }
        .preloader-glow {
          position: absolute;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, rgba(6, 182, 212, 0.1) 40%, rgba(11, 18, 32, 0) 70%);
          filter: blur(40px);
          animation: preloaderPulse 3s ease-in-out infinite;
          pointer-events: none;
        }
        .preloader-core-wrap {
          position: relative;
          width: 100px;
          height: 100px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 28px;
        }
        .preloader-ring-outer {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: #22c55e;
          border-right-color: #06b6d4;
          animation: preloaderSpin 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
          box-shadow: 0 0 20px rgba(34, 197, 94, 0.35);
        }
        .preloader-ring-inner {
          position: absolute;
          inset: 12px;
          border-radius: 50%;
          border: 2px dashed transparent;
          border-bottom-color: #10b981;
          border-left-color: #3b82f6;
          animation: preloaderSpinRev 2s linear infinite;
        }
        .preloader-text-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          z-index: 2;
        }
        .preloader-title {
          font-family: 'Roboto Mono', 'Courier New', monospace;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2px;
          color: #86efac;
          text-transform: uppercase;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .preloader-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #22c55e;
          box-shadow: 0 0 10px #22c55e;
          animation: preloaderDot 1.2s infinite ease-in-out;
        }
        .preloader-progress-track {
          width: 200px;
          height: 4px;
          border-radius: 999px;
          background: rgba(148, 163, 184, 0.15);
          overflow: hidden;
          position: relative;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .preloader-progress-bar {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, transparent 0%, #22c55e 50%, #06b6d4 100%);
          background-size: 200% 100%;
          animation: preloaderShimmer 1.5s ease-in-out infinite;
        }
        .preloader-slow-badge {
          display: none;
          margin-top: 14px;
          padding: 6px 14px;
          border-radius: 999px;
          background: rgba(15, 23, 42, 0.85);
          border: 1px solid rgba(234, 179, 8, 0.4);
          color: #fde047;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.8px;
          box-shadow: 0 4px 16px rgba(234, 179, 8, 0.2);
          animation: preloaderFadeIn 0.5s ease forwards;
        }
        @keyframes preloaderSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes preloaderSpinRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes preloaderPulse { 0%, 100% { opacity: 0.4; transform: scale(0.95); } 50% { opacity: 0.85; transform: scale(1.1); } }
        @keyframes preloaderDot { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        @keyframes preloaderShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes preloaderFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      </style>
      <div id="initial-preloader">
        <div class="preloader-glow"></div>
        <div class="preloader-core-wrap">
          <div class="preloader-ring-outer"></div>
          <div class="preloader-ring-inner"></div>
        </div>
        <div class="preloader-text-box">
          <div class="preloader-title">
            <span class="preloader-dot"></span>
            <span id="preloader-msg">INITIALIZING SYSTEM</span>
          </div>
          <div class="preloader-progress-track">
            <div class="preloader-progress-bar"></div>
          </div>
          <div id="preloader-slow-badge" class="preloader-slow-badge">
            📶 SLOW CONNECTION DETECTED • OPTIMIZING ASSETS
          </div>
        </div>
      </div>
      <script>
        (function() {
          var msgEl = document.getElementById('preloader-msg');
          var slowBadge = document.getElementById('preloader-slow-badge');
          var msgs = ['INITIALIZING SYSTEM', 'COMPILING ASSETS', 'CALIBRATING MATRIX', 'DECRYPTING PORTFOLIO'];
          var idx = 0;
          var msgTimer = setInterval(function() {
            idx = (idx + 1) % msgs.length;
            if (msgEl) msgEl.textContent = msgs[idx];
          }, 1400);

          // If loading takes > 1.8s, show slow network hint
          var slowTimer = setTimeout(function() {
            if (slowBadge) slowBadge.style.display = 'inline-flex';
          }, 1800);

          window.__clearInitialPreloader = function() {
            clearInterval(msgTimer);
            clearTimeout(slowTimer);
          };
        })();
      </script>
    </div>

  </body>
</html>
